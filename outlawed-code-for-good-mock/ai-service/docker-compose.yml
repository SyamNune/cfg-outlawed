version: '3.8'

services:
  python-service:
    build:
      context: ./embeddings-python
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    env_file:
      - ./embeddings-python/.env
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    restart: unless-stopped

  node-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5001:5001"
    env_file:
      - .env
    environment:
      - PYTHON_SERVICE_URL=http://python-service:8001
      - PORT=5001
    depends_on:
      - python-service
    restart: unless-stopped
